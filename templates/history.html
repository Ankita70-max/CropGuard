<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>History</title><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"></head><body><nav><b>🌱 CropGuard-AI</b><a href="/">New Scan</a></nav><main><h1>Scan History</h1><div class="tablewrap"><table><tr><th>Date</th><th>Crop</th><th>Disease</th><th>Confidence</th><th>Severity</th><th>Report</th></tr>{% for r in rows %}<tr><td>{{r.created_at}}</td><td>{{r.crop}}</td><td>{{r.disease}}</td><td>{{"%.2f"|format(r.confidence*100)}}%</td><td>{{r.severity}}</td><td><a href="/report/{{r.id}}">PDF</a></td></tr>{% else %}<tr><td colspan="6">No scans yet.</td></tr>{% endfor %}</table></div></main></body></html>
